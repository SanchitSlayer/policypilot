name: Backend

on:
  pull_request:
    paths: ["backend/**", "eval/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "eval/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: policypilot
          POSTGRES_PASSWORD: policypilot
          POSTGRES_DB: policypilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U policypilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Everything runs offline: fake embeddings and the fake LLM provider, no API keys.
      EMBEDDING_PROVIDER: fake
      DEFAULT_LLM_PROVIDER: fake
      DATABASE_URL: postgresql+asyncpg://policypilot:policypilot@localhost:5432/policypilot
      TEST_DATABASE_URL: postgresql+asyncpg://policypilot:policypilot@localhost:5432/policypilot_test
      MONGO_URL: mongodb://localhost:27017
      TEST_MONGO_URL: mongodb://localhost:27017
      REQUIRE_TEST_DBS: "1"
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache tokenizer files
        uses: actions/cache@v4
        with:
          path: .cache/tiktoken
          key: tiktoken-cl100k

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Backend coverage: {rate:.1f}%")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
