services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policypilot}
      POSTGRES_DB: ${POSTGRES_DB:-policypilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the databases are reached by service name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-policypilot}:${POSTGRES_PASSWORD:-policypilot}@postgres:5432/${POSTGRES_DB:-policypilot}
      MONGO_URL: mongodb://mongo:27017
      SAMPLE_DATA_DIR: /sample_data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./sample_data:/sample_data
      - ./eval:/eval
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes: refreshed by `docker compose up --build -V` when dependencies change
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
